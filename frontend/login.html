<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Dry Fruits Farm</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">Dry Fruits Farm</div>

        <p class="tagline">
            Healthy • Fresh • Premium Quality
        </p>
    </header>


    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="admin.html">Admin</a>
    </nav>


    <section class="auth-page">

        <div class="auth-box">

            <p class="section-title">WELCOME BACK</p>

            <h1>Login</h1>

            <p class="auth-subtitle">
                Login to your Dry Fruits Farm account.
            </p>


            <form>

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>


            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </section>


    <footer>

        <h3>Dry Fruits Farm</h3>

        <p>Fresh Dry Fruits For A Healthy Life</p>

        <p>© 2026 Dry Fruits Farm. All Rights Reserved.</p>

    </footer>

</body>
</html>
