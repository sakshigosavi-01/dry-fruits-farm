<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Dry Fruits Farm</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            Dry Fruits Farm
        </div>

        <p class="tagline">
            Healthy • Fresh • Premium Quality
        </p>

    </header>


    <nav class="navbar">

        <a href="/products/">Home</a>

        <a href="/products/">Products</a>

        <a href="/cart/">Cart</a>

        <a href="/login/">Login</a>

        <a href="/register/">Register</a>

        <a href="/admin/">Admin</a>

    </nav>


    <section class="auth-page">

        <div class="auth-box">

            <p class="section-title">
                CHECKOUT
            </p>

            <h1>
                Complete Your Order
            </h1>

            <p class="auth-subtitle">
                Enter your delivery details.
            </p>


            <form onsubmit="placeOrder(event)">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    required
                >


                <label>
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your delivery address"
                    rows="4"
                    required
                ></textarea>


                <label>
                    Payment Method
                </label>

                <select id="payment" required>

                    <option value="">
                        Select payment method
                    </option>

                    <option value="COD">
                        Cash on Delivery
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                </select>


                <div
                    id="orderTotal"
                    style="margin:20px 0; font-size:20px; font-weight:bold;"
                >
                    Total: ₹0
                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Place Order
                </button>

            </form>

        </div>

    </section>


    <footer>

        <h3>
            Dry Fruits Farm
        </h3>

        <p>
            Fresh Dry Fruits For A Healthy Life
        </p>

        <p>
            © 2026 Dry Fruits Farm. All Rights Reserved.
        </p>

    </footer>


    <script>

        function loadTotal() {

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            let total = 0;

            cart.forEach(function(product) {

                total += Number(product.price);

            });

            document.getElementById("orderTotal").innerText =
                "Total: ₹" + total;

        }


        function placeOrder(event) {

            event.preventDefault();

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;

            }


            alert(
                "Order placed successfully!"
            );


            localStorage.removeItem("cart");


            window.location.href = "/products/";

        }


        loadTotal();

    </script>

</body>

</html>
